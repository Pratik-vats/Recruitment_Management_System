<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Window Bar -->
  <path d="M 0 16 Q 0 0 16 0 L 984 0 Q 1000 0 1000 16 L 1000 48 L 0 48 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="28" cy="24" r="5" fill="#f43f5e" />
  <circle cx="44" cy="24" r="5" fill="#f59e0b" />
  <circle cx="60" cy="24" r="5" fill="#10b981" />
  <rect x="360" y="14" width="280" height="20" rx="6" fill="#f1f5f9" />
  <text x="500" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">TalentSync — Administrator Platform Metrics & Governance</text>

  <!-- 4 KPI Stat Cards -->
  <!-- Card 1: Total Users -->
  <g transform="translate(32, 68)" filter="url(#cardShadow)">
    <rect width="216" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#e0e7ff" />
    <text x="34" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#4338ca" text-anchor="middle">👥</text>
    <text x="64" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">Total Platform Users</text>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0f172a">7</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#10b981">✓ 4 Applicants • 2 Recruiters • 1 Admin</text>
  </g>

  <!-- Card 2: Active Jobs -->
  <g transform="translate(272, 68)" filter="url(#cardShadow)">
    <rect width="216" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#dbeafe" />
    <text x="34" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1d4ed8" text-anchor="middle">💼</text>
    <text x="64" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">Job Openings</text>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0f172a">6</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#2563eb">✓ 6 Open • 0 Expired (Auto-Tracked)</text>
  </g>

  <!-- Card 3: Total Applications -->
  <g transform="translate(512, 68)" filter="url(#cardShadow)">
    <rect width="216" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#fef3c7" />
    <text x="34" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#b45309" text-anchor="middle">📑</text>
    <text x="64" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">Active Applications</text>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0f172a">4</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#d97706">Across 5 Pipeline Stages</text>
  </g>

  <!-- Card 4: System Health -->
  <g transform="translate(752, 68)" filter="url(#cardShadow)">
    <rect width="216" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#dcfce7" />
    <text x="34" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#15803d" text-anchor="middle">🛡️</text>
    <text x="64" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">Security & Health</text>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#16a34a">100% OK</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#059669">RBAC • JWT • Multer • Helmet</text>
  </g>

  <!-- Governance User Management Table -->
  <g transform="translate(32, 188)" filter="url(#cardShadow)">
    <rect width="936" height="234" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Platform User Governance</text>
    <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Real-time account activation status, role filter, and cascade deletion oversight</text>

    <!-- Table Header -->
    <rect x="24" y="62" width="888" height="30" rx="6" fill="#f8fafc" />
    <text x="40" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569">USER</text>
    <text x="240" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569">EMAIL</text>
    <text x="440" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569">ROLE</text>
    <text x="600" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569">STATUS</text>
    <text x="760" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569">ACTIONS</text>

    <!-- Row 1: Pratik Vats -->
    <text x="40" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Pratik Vats</text>
    <text x="240" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">applicant@example.com</text>
    <rect x="440" y="102" width="70" height="20" rx="6" fill="#e0e7ff" />
    <text x="475" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4338ca" text-anchor="middle">applicant</text>
    <rect x="600" y="102" width="58" height="20" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="629" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Active</text>
    <text x="760" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#dc2626">Deactivate • Delete</text>

    <!-- Divider -->
    <line x1="24" y1="134" x2="912" y2="134" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Row 2: Vikram Malhotra -->
    <text x="40" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Vikram Malhotra</text>
    <text x="240" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">recruiter@example.com</text>
    <rect x="440" y="142" width="70" height="20" rx="6" fill="#fdf4ff" />
    <text x="475" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a21caf" text-anchor="middle">recruiter</text>
    <rect x="600" y="142" width="58" height="20" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="629" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Active</text>
    <text x="760" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#dc2626">Deactivate • Delete</text>

    <!-- Divider -->
    <line x1="24" y1="174" x2="912" y2="174" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Row 3: Rajesh Verma -->
    <text x="40" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Rajesh Verma (You)</text>
    <text x="240" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">admin@example.com</text>
    <rect x="440" y="182" width="70" height="20" rx="6" fill="#ffe4e6" />
    <text x="475" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#be123c" text-anchor="middle">admin</text>
    <rect x="600" y="182" width="58" height="20" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="629" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Active</text>
    <text x="760" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Protected</text>
  </g>
</svg>
