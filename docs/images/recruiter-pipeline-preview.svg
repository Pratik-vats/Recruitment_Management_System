  <circle cx="28" cy="24" r="5" fill="#f43f5e" />
  <circle cx="44" cy="24" r="5" fill="#f59e0b" />
  <circle cx="60" cy="24" r="5" fill="#10b981" />
  <rect x="360" y="14" width="280" height="20" rx="6" fill="#f1f5f9" />
  <text x="500" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">TalentSync — Recruiter Candidate Evaluation Pipeline</text>

